name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # A throwaway database for the retrieval benchmark below. The ordinary tests mock the database and never touch it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memex
          POSTGRES_PASSWORD: memex
          POSTGRES_DB: memex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memex -d memex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          DATABASE_URL: postgresql://memex:memex@localhost:5432/memex
          NODE_ENV: test

      - name: Retrieval benchmark (synthetic notes, rolled back)
        run: |
          npm run migrate
          npx vitest --run retrievalBenchmark
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          DATABASE_URL: postgresql://memex:memex@localhost:5432/memex
          MEMEX_REALDB_TEST: '1'
          NODE_ENV: test

      - name: Coverage (with threshold gate)
        run: npm run coverage
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          DATABASE_URL: postgresql://memex:memex@localhost:5432/memex
          NODE_ENV: test

  client:
    name: Client — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        # npm install instead of npm ci: the lockfile is Windows-generated and
        # omits Linux-specific optional deps (esbuild platform binaries).
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  mcp:
    name: MCP server — typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: the lock file was made on Windows and omits Linux-only optional packages.
      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production dependencies have no known advisories
        run: npm audit --omit=dev

  docker-smoke:
    name: Docker — build, start, first-run checks
    runs-on: ubuntu-latest
    needs: [server, client]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the image, start Postgres + app, run the checks
        # scripts/smoke-test.sh uses its own compose project and spare ports, a random JWT_SECRET, and removes
        # everything it created on exit. See the script for the list of checks.
        run: bash scripts/smoke-test.sh
